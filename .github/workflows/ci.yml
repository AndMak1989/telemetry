name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: myapp

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # mongodb-memory-server downloads a MongoDB binary on first use; keep it in a known, cached place.
      # An absolute path: env values are not shell-expanded, so "~" would be taken literally.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: myapp/package.json # version from "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: myapp/.nvmrc
          cache: pnpm
          cache-dependency-path: myapp/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile # fails if package.json and the lockfile disagree

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('myapp/pnpm-lock.yaml') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter web build

      # Bundles every Lambda and builds the CloudFormation template: catches bundling and CDK errors.
      # No AWS credentials needed. Prod is not synthesized here until its cdk.json block is filled in.
      - name: CDK synth (dev)
        run: pnpm synth
